name: action-ref-v1 conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SafeAgent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SafeAgent and focused test dependency
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Run action-ref focused tests
        run: python -m pytest tests/test_attestation_gate.py -q

      - name: Verify attestation-gate action-ref-v1 vectors
        uses: Composable-Evidence-Criteria/action-ref-conformance@56e25a8353ba02b76edb072c5bd405b56238bb12
        with:
          mode: verify-impl
          command: python scripts/action_ref_v1_impl.py

      - name: Verify Mycelium action-ref-v1 vectors
        uses: Composable-Evidence-Criteria/action-ref-conformance@56e25a8353ba02b76edb072c5bd405b56238bb12
        with:
          mode: verify-impl
          command: python scripts/action_ref_v1_mycelium_impl.py

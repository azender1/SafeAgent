name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run decorator example
        run: |
          python examples/decorator_safeagent.py

      - name: Run LangChain adapter example
        run: |
          python examples/langchain_adapter_safeagent.py

      - name: Run MCP retry demo
        run: |
          python examples/mcp_retry_demo.py

      - name: Run PeerPlay settlement demo
        run: |
          python examples/peerplay_tournament_settlement_demo.py
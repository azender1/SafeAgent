name: Visa sandbox readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Validate Visa sandbox credentials without network calls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install local package
        run: python -m pip install -e .

      - name: Validate credential material offline
        env:
          VISA_SANDBOX_ORG_ID: ${{ secrets.VISA_SANDBOX_ORG_ID }}
          VISA_SANDBOX_KEY_ID: ${{ secrets.VISA_SANDBOX_KEY_ID }}
          VISA_SANDBOX_SHARED_SECRET: ${{ secrets.VISA_SANDBOX_SHARED_SECRET }}
          VISA_SANDBOX_RESPONSE_MLE_P12_B64: ${{ secrets.VISA_SANDBOX_RESPONSE_MLE_P12_B64 }}
          VISA_SANDBOX_RESPONSE_MLE_PASSWORD: ${{ secrets.VISA_SANDBOX_RESPONSE_MLE_PASSWORD }}
          VISA_SANDBOX_RESPONSE_MLE_KEY_ID: ${{ secrets.VISA_SANDBOX_RESPONSE_MLE_KEY_ID }}
          VISA_SANDBOX_REQUEST_MLE_CERT_B64: ${{ secrets.VISA_SANDBOX_REQUEST_MLE_CERT_B64 }}
        run: python scripts/visa_sandbox_readiness.py

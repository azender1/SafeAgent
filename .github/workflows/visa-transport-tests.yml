name: Visa sandbox transport unit tests

on:
  push:
    branches:
      - work/visa-intelligent-commerce-sandbox
    paths:
      - 'safeagent_exec_guard/cybersource_transport.py'
      - 'tests/test_cybersource_transport.py'
      - '.github/workflows/visa-transport-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_cybersource_transport.py tests/test_cybersource_gateway.py

name: Publish safeagent-exec-guard

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Verify version is not already on PyPI
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml","rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          python - <<PY
          import json, urllib.request, urllib.error
          v="$VERSION"
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/safeagent-exec-guard/{v}/json") as r:
                  if r.status == 200:
                      raise SystemExit(f"safeagent-exec-guard {v} is already published")
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          PY
      - name: Build
        run: python -m build
      - name: Publish using API token
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload -u __token__ -p "$PYPI_API_TOKEN" dist/*
      - name: Publish using PyPI trusted publishing
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

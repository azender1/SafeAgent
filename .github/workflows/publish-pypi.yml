name: Publish safeagent-exec-guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "safeagent_exec_guard/**"
      - "RELEASE_NOTES_0.1.25.md"
      - ".github/workflows/publish-pypi.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Verify version is releasable
        id: gate
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml","rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$VERSION" != "0.1.25" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Automatic main-branch release is one-time scoped to 0.1.25; skipping $VERSION"
            exit 0
          fi
          if python - <<PY
          import urllib.request, urllib.error
          v="$VERSION"
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/safeagent-exec-guard/{v}/json")
          except urllib.error.HTTPError as e:
              raise SystemExit(0 if e.code == 404 else 2)
          raise SystemExit(1)
          PY
          then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "1" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "safeagent-exec-guard $VERSION is already published"
            else
              exit "$code"
            fi
          fi
      - name: Build
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: python -m build
      - name: Publish using API token
        if: ${{ steps.gate.outputs.publish == 'true' && env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload -u __token__ -p "$PYPI_API_TOKEN" dist/*
      - name: Publish using PyPI trusted publishing
        if: ${{ steps.gate.outputs.publish == 'true' && env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

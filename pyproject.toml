[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safeagent-exec-guard"
version = "0.1.21"
description = "AI agent execution guard — prevents duplicate actions from retries with exactly-once execution, request-id dedup, and durable receipts."
readme = "README.md"
requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [
  { name = "azender1" }
]

keywords = [
  "ai-agents",
  "idempotency",
  "exactly-once",
  "execution-guard",
  "reliability",
  "distributed-systems",
  "agent-infrastructure",
  "action-ref",
  "jcs",
  "mycelium",
  "soma",
  "webhook-deduplication",
  "on-chain-audit"
]

dependencies = [
  "psycopg[binary]>=3.1"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers"
]

[project.urls]
Homepage = "https://github.com/azender1/SafeAgent"
Source = "https://github.com/azender1/SafeAgent"
Issues = "https://github.com/azender1/SafeAgent/issues"

[project.optional-dependencies]
# pip install safeagent-exec-guard[payment]
payment = [
    "x402[fastapi,httpx,evm]>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "eth-account>=0.12",
    "jsonschema>=4.0",
    "opentimestamps-client>=0.7",
]
# pip install safeagent-exec-guard[test]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["safeagent_exec_guard", "settlement"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".venv",
  "*.db",
  "__pycache__",
  "dist",
  "*.egg-info",
  "examples",
  ".git",
]
